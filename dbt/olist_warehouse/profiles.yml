olist_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      threads: 4
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', 5432) | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'olist_admin') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'olist_secret_2024') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'olist_dw') }}"
      schema: public
