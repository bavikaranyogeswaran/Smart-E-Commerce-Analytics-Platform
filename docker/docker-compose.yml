name: olist-analytics

services:

  # ─────────────────────────────────────────────
  # PostgreSQL 15 — Staging + Warehouse Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: olist_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/01_create_staging_schema.sql:/docker-entrypoint-initdb.d/01_create_staging_schema.sql
      - ../sql/02_create_warehouse_schema.sql:/docker-entrypoint-initdb.d/02_create_warehouse_schema.sql
    networks:
      - olist_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Airflow — DB Initialization (runs once)
  # ─────────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: olist_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
    volumes:
      - ../airflow_workspace/dags:/opt/airflow/dags
      - ../airflow_workspace/logs:/opt/airflow/logs
      - ../airflow_workspace/plugins:/opt/airflow/plugins
      - ../data:/opt/airflow/data
      - ../dbt:/opt/airflow/dbt
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username $${AIRFLOW_WWW_USER_USERNAME:-admin} --firstname Admin --lastname User --role Admin --email admin@olist.com --password $${AIRFLOW_WWW_USER_PASSWORD:-admin123} 2>/dev/null || true"
    networks:
      - olist_network

  # ─────────────────────────────────────────────
  # Airflow — Scheduler
  # ─────────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: olist_airflow_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    volumes:
      - ../airflow_workspace/dags:/opt/airflow/dags
      - ../airflow_workspace/logs:/opt/airflow/logs
      - ../airflow_workspace/plugins:/opt/airflow/plugins
      - ../data:/opt/airflow/data
      - ../dbt:/opt/airflow/dbt
    command: scheduler
    networks:
      - olist_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────────
  # Airflow — Web Server (UI at :8080)
  # ─────────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: olist_airflow_webserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    volumes:
      - ../airflow_workspace/dags:/opt/airflow/dags
      - ../airflow_workspace/logs:/opt/airflow/logs
      - ../airflow_workspace/plugins:/opt/airflow/plugins
      - ../data:/opt/airflow/data
      - ../dbt:/opt/airflow/dbt
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - olist_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # FastAPI — Analytics API (at :8000)
  # ─────────────────────────────────────────────
  fastapi:
    build:
      context: ../backend-fastapi
      dockerfile: Dockerfile
    container_name: olist_fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    networks:
      - olist_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # React — Frontend Dashboard (at :3000)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend-react
      dockerfile: Dockerfile
    container_name: olist_frontend
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - olist_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ─────────────────────────────────────────────
# Named Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

networks:
  olist_network:
    driver: bridge
